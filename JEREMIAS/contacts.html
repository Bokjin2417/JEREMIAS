<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact | My Portfolio</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      background-color: #000;
      color: #fff;
    }
    .form-control,
    .form-control:focus {
      background-color: #222;
      border: 1px solid #444;
      color: #fff;
    }
    .contact-title {
      font-size: 2rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 3rem;
      text-transform: uppercase;
    }
    .contact-section {
      margin-top: 100px;
    }
    .contact-img {
      max-width: 100%;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
    }
    @media (max-width: 768px) {
      .contact-title {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>

  <header class="bg-dark text-white fixed-top">
    <nav class="navbar navbar-expand-md navbar-dark container">
      <a class="navbar-brand" href="#">Hello! I'm Jeremias!</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link text-white" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="skills.html">Skills</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="projects.html">Projects</a></li>
          <li class="nav-item"><a class="nav-link text-white active" href="contacts.html">Contact</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <main class="contact-section container py-5">
    <h2 class="contact-title">Get in Touch</h2>

    <div class="row align-items-center">
      <div class="col-md-6 mb-4">
        <form>
          <div class="mb-3">
            <label for="name" class="form-label">Full Name</label>
            <input type="text" class="form-control" id="name" placeholder="Your Name" required>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" class="form-control" id="email" placeholder="your@email.com" required>
          </div>
          <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea class="form-control" id="message" rows="4" placeholder="Type your message here..." required></textarea>
          </div>
          <button type="submit" class="btn btn-outline-light px-4">Contact Me</button>
        </form>
      </div>

      <div class="col-md-6 text-center">
        <img src="contaksiksyon.png" alt="Contact Image" class="contact-img">
      </div>
    </div>
  </main>

  <footer class="bg-black text-white text-center py-3">
    <p>&copy; 2025 My Portfolio. All Rights Reserved.</p>
  </footer>

  <!-- Toast -->
  <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
    <div id="messageToast" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body">
          Message Sent!
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const form = document.querySelector('form');
    const toastEl = document.getElementById('messageToast');
    const toast = new bootstrap.Toast(toastEl);

    form.addEventListener('submit', function(event) {
      event.preventDefault();
      toast.show();
      form.reset();
    });
  </script>

</body>
</html>
