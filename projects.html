<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Portfolio</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <style>
    body {
      background-color: #000000;
      color: #fff;
    }

    .list-group-item {
      background-color: transparent;
      border-color: #fff;
      color: #fff;
    }

    img {
      max-width: 100%;
      height: auto;
    }

    section {
      scroll-margin-top: 100px;
    }

    .header {
      color: #181722 !important;
    }

    .carousel-item img {
      width: 700px;
      max-height: 400px;
      object-fit: cover;
      margin: 0 auto;
    }

    .carousel-item h5 {
      color: #FFA500;
      font-weight: bold;
      font-family: 'Segoe UI', sans-serif;
      margin-top: 1rem !important;
    }
  </style>
</head>
<body>

  <div class="background-wrapper">
    <div class="background"></div>
  </div>

  <div class="foreground-content position-relative">

    <header class="bg-dark text-white fixed-top">
      <nav class="navbar navbar-expand-md navbar-dark container">
        <a class="navbar-brand" href="#">Hello! I'm Jeremias!</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
          aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link text-white" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="about.html">About</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="skills.html">Skills</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="projects.html">Projects</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="contacts.html">Contact</a></li>
          </ul>
        </div>
      </nav>
    </header>

    <main class="pt-5">
      <section id="projects" class="container py-5">
        <h2 class="text-center skills-title mb-4">Projects</h2>

        <div id="projectsCarousel" class="carousel slide" data-bs-ride="carousel">
          <div class="carousel-inner">

            <div class="carousel-item active text-center">
              <img src="cert.png" class="d-block mx-auto" alt="Project 1">
              <h5 class="mt-3">Freecodecamp Certificate</h5>
            </div>

            <div class="carousel-item text-center">
              <img src="tables.png" class="d-block mx-auto" alt="Project 2">
              <h5 class="mt-3">Tables Project</h5>
            </div>

            <div class="carousel-item text-center">
              <img src="form.png" class="d-block mx-auto" alt="Project 3">
              <h5 class="mt-3">Form Project</h5>
            </div>

          </div>

          <button class="carousel-control-prev" type="button" data-bs-target="#projectsCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
          </button>

          <button class="carousel-control-next" type="button" data-bs-target="#projectsCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
          </button>
        </div>
      </section>
    </main>

    <footer class="bg-black text-white text-center py-3">
      <p>&copy; 2025 My Portfolio. All Rights Reserved.</p>
    </footer>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
