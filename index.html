.background-wrapper {
  position: fixed;
  top: 0;
  left: 0;
  height: 100%;
  width: 100%;
  overflow: hidden;
  z-index: 0;
}

.background {
  background-color: #000000;
  background-image: url(4888) ;
  filter: blur(3px);
  background-size: cover;
  background-position: center;
  height: 100%;
  width: 100%;
  position: absolute;
  top: 0;
  left: 0;
  z-index: 0;
}

.foreground-content {

.background-video {
  position: fixed;
  top: 0;
  left: 0;
  min-width: 100%;
  min-height: 100%;
  object-fit: cover;
  z-index: 0;
   filter: brightness(0.8) blur(2px);
  animation: fadeOut 1s ease forwards;
  animation-delay: 11s; 
}

@keyframes fadeOut {
  to {
    opacity: 0;
    visibility: hidden;
  }
}
